name: Setup
description: The workspace as every job needs it, after checkout - pnpm and Node at their pinned versions, dependencies, and .env.
runs:
  using: composite
  steps:
    # The pnpm in package.json's packageManager, and the Node in .node-version, with pnpm's store cached between runs.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: cp .env.example .env
      shell: bash
