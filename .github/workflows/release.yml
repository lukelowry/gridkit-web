name: Release
# A tag pushes the service images, each tagged with it, once the stack they make has passed its smoke run.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
    env:
      GRIDKIT_REGISTRY: ghcr.io/${{ github.repository_owner }}/
      GRIDKIT_VERSION: ${{ github.ref_name }}
      GRIDKIT_SOLVER_TOKEN: release-${{ github.run_id }}
      GRIDKIT_LIBRARY_TOKEN: release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: docker compose up --build -d --wait
      - run: pnpm smoke
      - if: failure()
        run: docker compose logs
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested images with provenance, an SBOM, and the repository they come from
        run: >-
          docker buildx bake -f compose.yaml --push --provenance=mode=max --sbom=true
          --set "*.labels.org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
